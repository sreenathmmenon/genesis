[project]
name = "genesis-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "Genesis AI Agent Orchestration Platform — Backend"
dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.14.4",
    "duckduckgo-search>=8.1.1",
    "jira>=3.10.5",
    "notion-client>=3.1.0",
    "playwright>=1.60.0",
    "sendgrid>=6.12.5",
    "slack-sdk>=3.42.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
